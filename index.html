<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jagadish &amp; Manju's Kitchen</title>
<meta name="description" content="Home-style recipes by Jagadish and Manju, mostly from Tamil Nadu, that scale to the ingredients you have.">
<meta property="og:title" content="Jagadish &amp; Manju's Kitchen">
<meta property="og:description" content="Home-style recipes that scale to what you have.">
<meta name="google-site-verification" content="JE0sQN3Y79MiPf_JceMN9LnkA45MEovnoNm0NrBIczU" />
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#fbf6ef">
<meta property="og:site_name" content="Jagadish &amp; Manju's Kitchen">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:image" content="/images/og/home.png">
<meta property="og:type" content="website">
<script type="application/ld+json">
{"@context": "https://schema.org", "@type": "WebSite", "name": "Jagadish & Manju's Kitchen", "url": "/",
 "description": "Healthy keto weekday meals, Tamil Nadu village-style weekend cooking, and festival sweets and snacks. Every recipe scales to what you cook."}
</script>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<nav class="sitebar"><a class="brand" href="/">Jagadish &amp; Manju's <span>Kitchen</span></a><a class="plan-link" href="/plan/">🗓 Plan &amp; shop</a></nav>
<main class="wrap wide">
  <section class="hero">
    <h1>Jagadish &amp; Manju's Kitchen</h1>
    <p>Healthy keto meals for weekdays, Tamil Nadu village cooking for weekends, and sweets and snacks for festivals. Every recipe adjusts to the amount you're cooking.</p>
  </section>
  <div class="tabs" role="tablist" aria-label="Menu">
    <button type="button" role="tab" data-menu="weekday"><b>Weekday</b><span>Healthy keto</span></button>
    <button type="button" role="tab" data-menu="weekend"><b>Weekend</b><span>Village style</span></button>
    <button type="button" role="tab" data-menu="festival"><b>Festival</b><span>Diwali &amp; more</span></button>
  </div>
  <p class="menu-intro" id="menu-intro"></p>
  <div id="feature"></div>
  <input class="search" id="q" type="search" placeholder="Search all recipes, in English or தமிழ்…" aria-label="Search recipes">
  <div class="filters" role="group" aria-label="Quick filters">
    <button type="button" data-f="quick" aria-pressed="false">⏱ Under 1 hour</button>
    <button type="button" data-f="protein" aria-pressed="false">💪 30 g+ protein</button>
    <button type="button" data-f="chicken" aria-pressed="false">🍗 Chicken</button>
    <button type="button" data-f="seafood" aria-pressed="false">🐟 Seafood</button>
    <button type="button" data-f="veg" aria-pressed="false">🥚 Veg &amp; egg</button>
  </div>
  <div id="sections"></div>
  <p class="empty" id="empty">No recipes match that search.</p>
  <footer>Made with love in Waterloo, Ontario.</footer>
</main>
<script src="/assets/recipes.js"></script>
<script>
(function () {
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var MENUS = {
    weekday: { title: "Weekday · Healthy keto", intro: "Quick weeknight meals built on protein and fiber, with only the carbs the vegetables bring. Each recipe shows protein, carbs, fiber and the good-to-bad fat split per serving." },
    weekend: { title: "Weekend · Village style", intro: "Slow-cooked Tamil Nadu village favourites for the weekend: kuzhambu, biryani and more, cooked the traditional way." },
    festival: { title: "Festival · Sweets & snacks", intro: "The sweets and savouries we make for Diwali and other festivals, the way they're made at home in Tamil Nadu." }
  };
  var all = window.RECIPES || [];
  var sections = document.getElementById("sections"), q = document.getElementById("q"), empty = document.getElementById("empty");
  var featureEl = document.getElementById("feature"), introEl = document.getElementById("menu-intro");
  var tabs = [].slice.call(document.querySelectorAll(".tabs button"));
  var day = new Date().getDay();
  var menu = /^#(weekday|weekend|festival)$/.test(location.hash) ? location.hash.slice(1) : (day === 0 || day === 6 ? "weekend" : "weekday");

  function card(r) {
    var n = r.nutrition;
    return "<a class='rcard' href='/recipes/" + encodeURIComponent(r.slug) + "/'>" +
      (r.image
        ? "<div class='photo'><img src='" + esc(r.image) + "' alt='" + esc(r.title) + "' width='800' height='500' loading='lazy' decoding='async'>" + (r.time ? "<span class='badge'>⏱ " + esc(r.time) + "</span>" : "") + "</div>"
        : "<div class='band'>" + esc(r.emoji || "🍽️") + "</div>") +
      "<div class='body'><div class='kicker'>" + esc(r.kicker || "") + (!r.image && r.time ? " · " + esc(r.time) : "") + "</div>" +
      "<h2>" + esc(r.title) + "</h2>" + (r.tamil ? "<div class='native' lang='ta'>" + esc(r.tamil) + "</div>" : "") +
      (ratings[r.slug] && ratings[r.slug].count ? "<div class='stars-line'>★ " + ratings[r.slug].avg.toFixed(1) + " <span>(" + ratings[r.slug].count + ")</span></div>" : "") + (r.author ? "<div class='byline'>By " + esc(r.author) + "</div>" : "") +
      (n ? "<div class='macro-line'>" + (n.per ? "Per " + esc(n.per) + ": " : "") + n.protein + "g protein · " + n.carbs + "g carbs · " + n.fiber + "g fiber" +
        (n.goodFatPct != null ? " · <span class='fat-good'>" + n.goodFatPct + "% good fat</span>" : "") + "</div>" : "") +
      "<p>" + esc(r.blurb || "") + "</p>" +
      "<div class='tags'>" + (r.tags || []).map(function (t) { return "<span class='tag'>" + esc(t) + "</span>"; }).join("") + "</div>" +
      "</div></a>";
  }
  // quick filters
  var ratings = {}, active = {};
  function minutes(t) { var h = /(\d+)\s*h/.exec(t || ""), m = /(\d+)\s*min/.exec(t || ""); return (h ? +h[1] * 60 : 0) + (m ? +m[1] : 0); }
  function has(r, words) { var t = (r.tags || []).join(" ").toLowerCase(); return words.some(function (w) { return t.indexOf(w) > -1; }); }
  var FILTERS = {
    quick: function (r) { var m = minutes(r.time); return m > 0 && m <= 60; },
    protein: function (r) { return r.nutrition && r.nutrition.protein >= 30; },
    chicken: function (r) { return has(r, ["chicken"]); },
    seafood: function (r) { return has(r, ["seafood", "fish", "crab", "prawn"]); },
    veg: function (r) { return has(r, ["vegetarian", "egg", "paneer"]); }
  };
  var filterBtns = [].slice.call(document.querySelectorAll(".filters button"));
  filterBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      var k = b.getAttribute("data-f"); active[k] = !active[k]; if (!active[k]) delete active[k];
      b.classList.toggle("on", !!active[k]); b.setAttribute("aria-pressed", !!active[k]); draw();
    });
  });
  fetch("/api/rate").then(function (r) { return r.ok ? r.json() : {}; }).then(function (d) { if (d && !d.error) { ratings = d; draw(); } }).catch(function () {});

  function draw() {
    var term = q.value.trim().toLowerCase(), filtering = Object.keys(active).length > 0;
    tabs.forEach(function (b) { var on = b.getAttribute("data-menu") === menu; b.className = on ? "on" : ""; b.setAttribute("aria-selected", on); });
    var anyMenu = term || filtering;
    introEl.textContent = anyMenu ? "" : MENUS[menu].intro;
    var f = !anyMenu && all.filter(function (r) { return r.featured && (r.menu || "weekend") === menu && (r.hero || r.image); })[0];
    featureEl.innerHTML = f
      ? "<a class='feature' href='/recipes/" + encodeURIComponent(f.slug) + "/'><img src='" + esc(f.hero || f.image) + "' alt='" + esc(f.title) + "' width='1600' height='1000' fetchpriority='high'>" +
        "<div class='ftext'><span class='flabel'>Chef's special</span><h2>" + esc(f.title) + "</h2><p>" + esc(f.blurb || "") + "</p><span class='cta'>Cook it →</span></div></a>"
      : "";
    var shown = 0, html = "";
    (anyMenu ? ["weekday", "weekend", "festival"] : [menu]).forEach(function (m) {
      var list = all.filter(function (r) {
        if ((r.menu || "weekend") !== m) return false;
        for (var k in active) if (!FILTERS[k](r)) return false;
        if (!term) return !(f && r.slug === f.slug);   // already shown in the banner
        return [r.title, r.tamil || "", r.kicker, r.blurb].concat(r.tags || []).join(" ").toLowerCase().indexOf(term) > -1;
      });
      if (!list.length) return;
      shown += list.length;
      html += "<h2 class='section-title'>" + (anyMenu ? MENUS[m].title : (f ? "More recipes" : "Recipes")) + "</h2><div class='grid'>" + list.map(card).join("") + "</div>";
    });
    sections.innerHTML = html;
    empty.style.display = shown || !anyMenu ? "none" : "block";
    empty.textContent = term ? "No recipes match that search." : "No recipes match those filters yet.";
  }
  tabs.forEach(function (b) {
    b.addEventListener("click", function () {
      menu = b.getAttribute("data-menu");
      history.replaceState(null, "", "#" + menu);
      draw();
    });
  });
  window.addEventListener("hashchange", function () { if (/^#(weekday|weekend|festival)$/.test(location.hash)) { menu = location.hash.slice(1); draw(); } });
  q.addEventListener("input", draw);
  draw();

  // When you come back to an open page (or a Home Screen shortcut resumes it),
  // check for an updated recipe list and redraw without a full reload.
  var lastList = null, checking = false;
  function checkForUpdates() {
    if (checking || document.visibilityState !== "visible") return;
    checking = true;
    fetch("/assets/recipes.js", { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : null; }).then(function (txt) {
      if (txt == null) return;
      if (lastList === null) { lastList = txt; return; }
      if (txt === lastList) return;
      lastList = txt;
      var w = {}; new Function("window", txt)(w);
      if (Array.isArray(w.RECIPES)) { all = window.RECIPES = w.RECIPES; draw(); }
    }).catch(function () {}).then(function () { checking = false; });
  }
  checkForUpdates();
  document.addEventListener("visibilitychange", checkForUpdates);
  window.addEventListener("pageshow", function (e) { if (e.persisted) location.reload(); });

  // Offline support: save the site on this phone (see /sw.js).
  if ("serviceWorker" in navigator && window.isSecureContext) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
  }
})();
</script>
</body>
</html>
