<main class="wrap" id="recipe"></main>

<script>
/*
 * 2. Fill in the recipe below.
 *
 * scale — pick ONE:
 *   Weight-based (meat, fish, veg):  { type: "weight", label: "How much mutton do you have?", baseGrams: 500, defaultUnit: "lb", defaultValue: 1.1 }
 *   Servings-based (rice, dosa):     { type: "servings", base: 4 }
 *   Count-based (sweets, snacks):    { type: "servings", base: 20, step: 5, label: "How many laddus do you want to make?", unitLabel: "laddus" }
 *
 * Ingredient units: "tsp", "tbsp", "cup", "g", "count", "sprig", or "main" (the main ingredient, weight recipes only).
 * exp: how fast it grows with batch size. 1 (default) = linear. Use about 0.8 for water and chilies, 0.85 for oil.
 * spice: true → follows the Mild/Medium/Hot buttons (needs spiceLevels: true).
 * id: give an ingredient an id to show its scaled quantity in a step, e.g. "Add {water} water".
 * Step min = minutes at the base amount. exp: about 0.4–0.6 for frying or simmering, 0 for fixed times.
 * bigNote: extra advice shown only for big batches.
 */
window.RECIPE = {
  slug: "my-new-recipe",            // must match the folder name
  menu: "weekday",                  // "weekday" (healthy keto), "weekend" (village style) or "festival"
  image: "/images/my-new-recipe.jpg", // a landscape photo; delete this line if you have none yet
  title: "My New Recipe",
  author: "Manju",                 // "Jagadish", "Manju" or "Jagadish & Manju"
  native: "",                       // optional, e.g. "மட்டன் குழம்பு · Tamil Nadu"
  intro: "Short intro about the dish.",
  scale: { type: "servings", base: 4 },
  baseServings: 4,
  spiceLevels: false,
  prepMin: 10,
  pots: null,                       // optional: [[1.2, "3–4 L"], [99, "6 L+"]]
  serveWith: "",
  // optional, per serving — shown as a panel on the page (use it for weekday recipes):
  // nutrition: { kcal: 350, protein: 35, fiber: 6, netCarbs: 8, fat: 18, note: "Estimated from standard values." },
  groups: [
    { title: "Ingredients", items: [
      { name: "rice", amt: 1, unit: "cup" },
      { id: "water", name: "water", amt: 2, unit: "cup", exp: 0.9 },
      { name: "salt", amt: 1, unit: "tsp" }
    ]}
  ],
  steps: [
    { t: "First step", min: 5, txt: "Describe the step. Add {water} water." }
  ],
  tips: []
};
</script>
<script src="/assets/recipe-engine.js"></script>
</body>
</html>
